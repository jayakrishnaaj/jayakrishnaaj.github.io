<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jayakrishna Ajithkumar Jayasree — Data Engineer & M.Sc. Digital Engineering</title>
    <meta
      name="description"
      content="Portfolio of Jayakrishna Ajithkumar Jayasree — Data Engineer (Azure, Databricks, PySpark) and M.Sc. Digital Engineering student at OvGU Magdeburg working on graph neural network surrogate models."
    />
    <meta name="author" content="Jayakrishna Ajithkumar Jayasree" />
    <meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />

    <!-- Open Graph / social previews. Add og:image once you have a preview picture. -->
    <link rel="canonical" href="https://jayakrishnaaj.github.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jayakrishnaaj.github.io/" />
    <meta property="og:title" content="Jayakrishna Ajithkumar Jayasree — Data Engineer & M.Sc. Digital Engineering" />
    <meta
      property="og:description"
      content="Data Engineer (Azure, Databricks, PySpark) and M.Sc. Digital Engineering student at OvGU Magdeburg."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Apply saved / system theme before first paint to avoid a flash -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <noscript>This portfolio needs JavaScript enabled.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
